<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Orbit Ring -->
  <circle cx="50" cy="50" r="42" stroke="url(#orbitGrad)" stroke-width="2.5" stroke-dasharray="8 4" opacity="0.8" />
  
  <!-- Central Road Crest / Hexagon Shield -->
  <polygon points="50,16 82,33 82,67 50,84 18,67 18,33" fill="#0B112C" stroke="#00F2FE" stroke-width="2" filter="url(#glow)" />
  
  <!-- Perspective Road Lines -->
  <polygon points="34,74 44,40 56,40 66,74" fill="#111B44" opacity="0.9" />
  
  <!-- Road Dashed Centerline -->
  <line x1="50" y1="42" x2="50" y2="52" stroke="#00F2FE" stroke-width="2" stroke-linecap="round" />
  <line x1="50" y1="58" x2="50" y2="72" stroke="#00F2FE" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Pothole Hazard Radar Ring -->
  <ellipse cx="50" cy="64" rx="8" ry="4" fill="none" stroke="#8B5CF6" stroke-width="2" />
  <circle cx="50" cy="64" r="2.5" fill="#00F2FE" />
  
  <!-- Tech Satellite Nodes -->
  <circle cx="82" cy="33" r="3.5" fill="#00F2FE" />
  <circle cx="18" cy="67" r="3.5" fill="#8B5CF6" />
</svg>
