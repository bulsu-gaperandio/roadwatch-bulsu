<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="waterDepth" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#021a2e"/>
      <stop offset="50%" stop-color="#072b49"/>
      <stop offset="85%" stop-color="#0d4068"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </radialGradient>
    <filter id="noiseFilter3">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.18  0 0 0 0 0.22  0 0 0 0 0.28 0 0 0 0.35 0"/>
    </filter>
  </defs>

  <!-- Asphalt Road Base -->
  <rect width="800" height="500" fill="#18202d" />
  <rect width="800" height="500" filter="url(#noiseFilter3)" opacity="0.45" />

  <!-- Road markings: pedestrian crossing strip remnants -->
  <rect x="80" y="400" width="80" height="40" fill="#E2E8F0" opacity="0.4"/>
  <rect x="220" y="400" width="80" height="40" fill="#E2E8F0" opacity="0.3"/>
  <rect x="360" y="400" width="80" height="40" fill="#E2E8F0" opacity="0.35"/>
  <rect x="500" y="400" width="80" height="40" fill="#E2E8F0" opacity="0.45"/>

  <!-- Main Water Puddled Pothole -->
  <ellipse cx="430" cy="240" rx="190" ry="110" fill="#111827" stroke="#374151" stroke-width="6"/>
  <ellipse cx="430" cy="240" rx="170" ry="95" fill="url(#waterDepth)"/>

  <!-- Water Ripples & Sky Reflection -->
  <ellipse cx="410" cy="230" rx="90" ry="35" fill="#38BDF8" opacity="0.25" />
  <ellipse cx="460" cy="250" rx="60" ry="20" fill="#00F2FE" opacity="0.3" />
  <circle cx="370" cy="215" r="4" fill="#E2E8F0" opacity="0.6"/>

  <!-- Submerged Asphalt Debris -->
  <ellipse cx="360" cy="270" rx="15" ry="9" fill="#0a101d"/>
  <ellipse cx="490" cy="260" rx="20" ry="12" fill="#0a101d"/>

  <!-- Geotag Stamp -->
  <rect x="25" y="25" width="280" height="68" rx="8" fill="#050816" fill-opacity="0.88" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="40" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="bold" fill="#38BDF8">FIELD PHOTO • CAPITOL ROAD</text>
  <text x="40" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" fill="#94A3B8">Brgy. Guinhawa, Malolos City</text>
</svg>
