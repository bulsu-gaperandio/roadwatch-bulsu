<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="craterDepth" cx="48%" cy="52%" r="50%">
      <stop offset="0%" stop-color="#020307"/>
      <stop offset="45%" stop-color="#0a0f1d"/>
      <stop offset="85%" stop-color="#1e2738"/>
      <stop offset="100%" stop-color="#334155"/>
    </radialGradient>
    <filter id="noiseFilter">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.15   0 0 0 0 0.2   0 0 0 0 0.28  0 0 0 0.35 0"/>
    </filter>
    <linearGradient id="yellowLine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Asphalt Road Base -->
  <rect width="800" height="500" fill="#1b2230" />
  <rect width="800" height="500" filter="url(#noiseFilter)" opacity="0.4" />

  <!-- Road markings (MacArthur Highway Lane Markings) -->
  <rect x="0" y="440" width="800" height="12" fill="#E2E8F0" opacity="0.6"/>
  <rect x="180" y="30" width="140" height="14" fill="url(#yellowLine)"/>
  <rect x="480" y="30" width="140" height="14" fill="url(#yellowLine)"/>

  <!-- Surrounding asphalt cracks & spidering fissures -->
  <path d="M 280 200 L 320 220 L 370 215 L 430 240 M 320 220 L 310 250 M 370 215 L 390 190" stroke="#0b0f17" stroke-width="3" fill="none" opacity="0.85"/>
  <path d="M 520 280 L 580 295 L 620 270 M 580 295 L 600 340" stroke="#0b0f17" stroke-width="2.5" fill="none" opacity="0.85"/>
  <path d="M 250 330 L 290 320 L 310 360 M 420 370 L 450 410" stroke="#0b0f17" stroke-width="2" fill="none" opacity="0.75"/>

  <!-- Main Pothole Cavity Outer Rim (Eroded edges) -->
  <path d="M 330 190 C 420 180, 520 200, 550 250 C 580 300, 530 360, 460 380 C 380 400, 310 370, 290 310 C 270 250, 260 200, 330 190 Z" 
        fill="#263143" stroke="#475569" stroke-width="4"/>

  <!-- Deep Crater Body -->
  <path d="M 345 205 C 415 195, 505 210, 530 255 C 555 300, 510 345, 450 365 C 380 380, 320 355, 305 310 C 290 260, 285 220, 345 205 Z" 
        fill="url(#craterDepth)"/>

  <!-- Exposed Base Gravel & Aggregate Stones -->
  <circle cx="380" cy="280" r="14" fill="#384353"/>
  <circle cx="440" cy="270" r="18" fill="#2d3748"/>
  <circle cx="410" cy="310" r="12" fill="#4a5568"/>
  <circle cx="480" cy="300" r="16" fill="#323d4e"/>
  <circle cx="350" cy="320" r="10" fill="#2d3748"/>
  <circle cx="460" cy="240" r="11" fill="#4a5568"/>

  <!-- Inner Water Puddle Reflection -->
  <ellipse cx="430" cy="295" rx="55" ry="25" fill="#00F2FE" opacity="0.18" />
  <ellipse cx="420" cy="290" rx="35" ry="14" fill="#38BDF8" opacity="0.25" />

  <!-- Geotag & Road Identification Stamp (Demonstration Overlay) -->
  <rect x="25" y="25" width="280" height="68" rx="8" fill="#050816" fill-opacity="0.88" stroke="#00F2FE" stroke-width="1.2"/>
  <text x="40" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="bold" fill="#00F2FE">FIELD PHOTO • MACARTHUR HWY</text>
  <text x="40" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" fill="#94A3B8">Brgy. Guinhawa, Malolos City (Near BulSU)</text>
</svg>
